# Rolling web Deployment — migrations run via migrate-job.yaml, not init containers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pawtraitry-web
  namespace: production
  labels:
    app: pawtraitry
    component: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: pawtraitry
      component: web
  template:
    metadata:
      labels:
        app: pawtraitry
        component: web
    spec:
      containers:
        - name: web
          image: ghcr.io/example/pawtraitry:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: app-database
            - secretRef:
                name: app-env
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pawtraitry-web
  namespace: production
  labels:
    app: pawtraitry
    component: web
spec:
  type: ClusterIP
  selector:
    app: pawtraitry
    component: web
  ports:
    - name: http
      port: 80
      targetPort: http
