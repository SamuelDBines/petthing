# HTTP cron triggers for the Next.js app. Requires CRON_SECRET in secret `app-cron`.
# Replace APP_BASE_URL with the canonical production URL (e.g. https://pawtraitry.co.uk).
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron-generate
  namespace: production
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:8.5.0
              envFrom:
                - configMapRef:
                    name: app-cron-config
                - secretRef:
                    name: app-cron
              command:
                - /bin/sh
                - -ec
                - |
                  curl -fsS -H "Authorization: Bearer $CRON_SECRET" "${APP_BASE_URL}/api/cron/generate"
---
