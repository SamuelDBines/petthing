[project]
name = "pawtraitry-content-worker"
version = "0.1.0"
description = "Automated social content engine for Pawtraitry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.140.0",
  "sentry-sdk>=2.20.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "apscheduler>=3.10.4",
  "httpx>=0.28.0",
  "python-multipart>=0.0.12",
  "pillow>=11.0.0",
  "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
