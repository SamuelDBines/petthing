name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      ADMIN_PASSWORD_LOGIN: "true"
      ADMIN_PASSWORD: ci-admin
      ADMIN_SESSION_SECRET: ci-admin-session
      AUTH_SECRET: ci-auth-secret
      CRON_SECRET: ci-cron
      MOCK_MODERATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Next.js app image
        run: docker build -t pawtraitry-app:ci .
      - name: Build content-worker image
        run: docker build -t pawtraitry-content-worker:ci ./content-worker

  content-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: content-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
